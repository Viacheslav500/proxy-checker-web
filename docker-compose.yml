services:
  flask_app:
    container_name: proxy_checker_web
    build: . 
    env_file:
      - .env
    ports:
      - "5000:5000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4.13
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${USERNAME}
      MYSQL_PASSWORD: ${PASSWORD_MYSQL}
    volumes: 
      - mysql-data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes: 
  mysql-data:
