services:
  db:
    image: mysql:8.4.13
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${USERNAME}
      MYSQL_PASSWORD: ${PASSWORD_MYSQL}
    volumes: 
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
volumes: 
  mysql-data:
