[project]
name = "proxy-checker-web"
version = "0.1.0"
description = "A simple Flask web application for checking proxy servers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=27.0.1",
    "mysql-connector-python>=26.7.0",
    "python-dotenv>=1.2.4",
    "requests[socks]>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.force-include] 
"templates" = "templates"
"static" = "static"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
