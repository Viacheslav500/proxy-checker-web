{% extends 'base.html' %}
{% block content %}

    <form class='login_form' method='POST' action='/login'>
        <div class='user_log'>
            <label for='user'>Nickname</label>
            <input type='text' id='user' name='user_name' placeholder='Enter your name' minlength='3' required>
            <label for='pass'>Password</label>
            <input type='text' id='pass' name='login_password' placeholder='Enter your password' minlength='8' required>
            <button type='submit'>Log in</button>
        </div>
    </form>

{% endblock %}
