<!DOCTYPE html>
<html lang='ru'>
    <head>
        <meta charset='utf-8'>
        <title>Web proxy checker</title>
        <link rel='stylesheet' href="{{url_for('static', filename='style.css') }}">
    </head>
    <body>
        <header>
            <h1>Proxy Checker</h1>
        </header>

        <main class='content'>
            <div class='description'>
                <p>This one-page site is made to check free proxies and to show the results</p>
            </div>

            <form class='proxy-form' method='POST' action='/'>
                <div class='proxy'>
                    <label for='proxy-input'>Enter proxy address</label>
                    <input type='text' name='proxy' id='proxy-input' placeholder='socks5://66.42.59.155:443'>
                    <input type='submit' id='submit-button' value='Submit'>
                </div>
            </form>
            {% block content %}
            {% endblock %}
        </main>

        <footer>
            <p>There will be github link</p>
        </footer>
    </body>
</html>
