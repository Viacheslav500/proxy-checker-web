{% extends 'base.html' %}

{% block content %}
    <form class='proxy-form' method='POST' action='/index'>
                <div class='proxy'>
                    <label for='proxy-input'>Enter proxy address</label>
                    <input type='text' name='proxy' id='proxy-input' placeholder='socks5://66.42.59.155:443'>
                    <input type='submit' id='submit-button' value='Submit'>
                </div>
    </form>

    {% if result %}
        <form class='returned_result'>
            <div class='checked'>
                <label for='checked'>Your answer</label>
                <input type='text' id='result-output' value='{{ result }}' readonly>
            </div>
        </form>
    {% endif %}

{% endblock %}
