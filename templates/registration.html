{% extends 'base.html' %}

{% block content %}


    <form class='reg_form' method='POST' action='/registration'>
        <div class='user_reg'>
            <label for='user_nick'>Nickname</label>
            <input type='text' name='nickname' id='user_nick' placeholder='Enter your name' minlength='3' required>
            <label for='user_pass'>Password</label>
            <input type='text' name='user_password' id='user_pass' placeholder='Enter your password' minlength='8' required>
            <label for='user_conf'>Confirm the password</label>
            <input type='text' name='pass_confirmation' id='user_conf' placeholder='Enter the password again' minlength='8' required>
            <button type='submit'>Sign up</button>
        </div>
    </form>

{% endblock %}
